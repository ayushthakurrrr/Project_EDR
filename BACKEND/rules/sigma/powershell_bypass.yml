title: PowerShell Execution Policy Bypass and Hidden Window
id: 66666-77777-88888
status: test
description: Detects PowerShell executing with hidden windows or bypassing execution policies.
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: 
            - 'bypass'
            - '-w hidden'
            - '-windowstyle hidden'
            - '-enc'
            - 'downloadstring'
    condition: selection
level: high