title: Suspicious File Download via Certutil or Bitsadmin
id: 55555-44444-33333
status: test
description: Detects the use of certutil.exe or bitsadmin.exe to download files from the internet, a common technique for ingress tool transfer.
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: 
            - '\certutil.exe'
            - '\bitsadmin.exe'
        CommandLine|contains: 
            - 'urlcache'
            - 'split'
            - 'transfer'
    condition: selection
level: critical